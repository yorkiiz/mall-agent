# 前端 nginx 增加一段转发（贴进 /root/myapp/conf/default.conf 的 server 块内，
# 放在现有 location /api 之前），风格与现有 resolver 变量式 proxy_pass 保持一致：

    # AI 导购 Agent
    location /api/agent/ {
        set $agent_upstream http://mall-agent-svc;
        proxy_pass $agent_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;   # LLM 生成较慢，放宽读超时
    }

# 注意：proxy_pass 不带末尾路径，/api/agent/chat 原样转发给 Agent。
# 修改后（hostPath 认目录 inode，必须就地覆盖文件）：
#   1. 在 master 上编辑 /root/myapp/conf/default.conf 就地修改（不要 rm 重建目录）
#   2. kubectl rollout restart deploy myapp-frontend
#   3. 验证：curl -s http://47.98.20.61:30080/api/agent/actuator/health 不通过 nginx 也能
#      直接 kubectl exec 进 nginx 容器 curl mall-agent-svc:8081/actuator/health
